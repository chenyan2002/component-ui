[package]
name = "bindgen"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "bindgen-test"
path = "src/main.rs"

[profile.release]
debug = false
debug-assertions = false
lto = true
opt-level = 'z'
overflow-checks = false
panic = 'abort'
rpath = false
strip = true

[dependencies]
anyhow = "1.0.97"
heck = "0.5.0"
wit-bindgen = "0.63.0"
wit-component = "0.262.0"
wit-parser = { version = "0.262.0", default-features = false }
# proxy-component's fork, which adds resource handles, so both tools read and write the same
# WAVE. Without the default `wit` feature, which would pull in an older wit-parser.
wasm-wave = { git = "https://github.com/chenyan2002/wasm-tools.git", rev = "efecaa186fc3c3abe637bcad6234403b28d09322", default-features = false }
