name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# Read-only by default; only the deploy job can push.
permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # The deploy action pushes to the gh-pages branch with the workflow's GITHUB_TOKEN.
    permissions:
      contents: write
    # Never push to gh-pages from two runs at once; a newer deploy waits for the current one.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          single-commit: true
          folder: dist
